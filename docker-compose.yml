services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: top14_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"

  db:
    image: mariadb:11
    container_name: top14_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: top14
    ports:
      - "3306:3306"